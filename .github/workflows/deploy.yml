name: Remote Deploy CI/CD

on:
  push:
    branches:
      - main
      - master

jobs:
  test-and-typecheck:
    name: Test and Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --if-present

      - name: Typecheck
        run: pnpm check-types --if-present

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Remote VPS
    needs: test-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: 88.150.138.98
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            cd /root/projects/HexForm-a-Formbuilder

            echo "Pulling latest code..."
            git pull origin main || git pull origin master

            echo "Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "Building project..."
            pnpm build

            echo "Running migrations..."
            pnpm db:migrate --if-present

            echo "Restarting PM2..."
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js

            echo "Saving PM2 state..."
            pm2 save

            echo "Deployment completed successfully!"
