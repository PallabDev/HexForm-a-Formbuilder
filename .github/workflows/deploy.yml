name: Remote Deploy CI/CD

on:
  push:
    branches:
      - main
      - master

jobs:
  test-and-typecheck:
    name: Test and Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Remote VPS
    needs: test-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: 88.150.138.98
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            # Explicitly load NVM to ensure we use the same Node/PM2 as the interactive shell
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            fi

            # Source profile as backup
            source ~/.bashrc || source ~/.profile || true

            # Print debug info to verify paths and environment
            echo "=== Node/PM2 Environment Info ==="
            echo "Current Path: $PATH"
            echo "Node Path: $(which node || echo 'Not Found')"
            echo "Node Version: $(node -v || echo 'Not Found')"
            echo "PM2 Path: $(which pm2 || echo 'Not Found')"
            echo "PM2 Version: $(pm2 -v || echo 'Not Found')"
            echo "PM2 Home: $PM2_HOME"
            echo "================================="

            cd /root/projects/HexForm-a-Formbuilder

            git pull origin main || git pull origin master

            pnpm install --frozen-lockfile

            pnpm build

            pm2 delete hexform-backend hexform-frontend || true
            pm2 start ecosystem.config.js

            pm2 save
