name: Remote Deploy CI/CD

on:
  push:
    branches:
      - main
      - master

jobs:
  test-and-typecheck:
    name: Test and Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Remote VPS
    needs: test-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: 222.167.207.36
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            fi

            source ~/.bashrc || true
            source ~/.profile || true

            echo "================================="
            echo "DOCKER INFO"
            echo "================================="

            docker --version
            docker compose version

            echo "================================="
            echo "PROJECT DIRECTORY"
            echo "================================="

            cd /root/project

            if [ ! -d "hexform" ]; then
              echo "Cloning repository for the first time..."
              git clone https://github.com/PallabDev/HexForm-a-Formbuilder.git hexform
            fi

            cd hexform

            echo "================================="
            echo "PULLING LATEST CHANGES"
            echo "================================="

            git reset --hard
            git clean -fd
            git pull origin main || git pull origin master || true

            echo "================================="
            echo "ENV FILE"
            echo "================================="

            if [ ! -f .env ]; then
              echo "ERROR: .env file not found!"
              exit 1
            fi

            echo "================================="
            echo "STOPPING EXISTING CONTAINERS"
            echo "================================="

            docker compose -f compose.yaml down || true

            echo "================================="
            echo "BUILDING AND STARTING"
            echo "================================="

            docker compose -f compose.yaml up -d --build

            echo "================================="
            echo "WAITING FOR CONTAINERS"
            echo "================================="

            sleep 10

            echo "================================="
            echo "CONTAINER STATUS"
            echo "================================="

            docker compose -f compose.yaml ps
            docker compose -f compose.yaml logs --tail=50

            echo "================================="
            echo "DEPLOY DONE"
            echo "================================="
