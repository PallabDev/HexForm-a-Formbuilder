name: Remote Deploy CI/CD

on:
  push:
    branches:
      - main
      - master

jobs:
  test-and-typecheck:
    name: Test and Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

deploy:
  name: Deploy to Remote VPS
  needs: test-and-typecheck
  runs-on: ubuntu-latest

  steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3

      with:
        host: 88.150.138.98
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22

        script: |
          export NVM_DIR="$HOME/.nvm"

          if [ -s "$NVM_DIR/nvm.sh" ]; then
            source "$NVM_DIR/nvm.sh"
          fi

          source ~/.bashrc || true
          source ~/.profile || true

          echo "================================="
          echo "NODE INFO"
          echo "================================="

          which node
          node -v

          echo "================================="
          echo "PNPM INFO"
          echo "================================="

          which pnpm
          pnpm -v

          echo "================================="
          echo "PM2 INFO"
          echo "================================="

          which pm2
          pm2 -v

          echo "================================="
          echo "PROJECT FILES"
          echo "================================="

          cd /root/projects/HexForm-a-Formbuilder

          pwd

          ls -la

          echo "================================="
          echo "INSTALLING"
          echo "================================="

          pnpm install --frozen-lockfile

          echo "================================="
          echo "BUILDING"
          echo "================================="

          NODE_OPTIONS="--max-old-space-size=4096" pnpm build

          echo "================================="
          echo "PM2 ECOSYSTEM FILE"
          echo "================================="

          cat ecosystem.config.js

          echo "================================="
          echo "STARTING PM2"
          echo "================================="

          pm2 start ecosystem.config.js --update-env

          echo "================================="
          echo "PM2 LIST"
          echo "================================="

          pm2 list

          echo "================================="
          echo "PM2 DESCRIBE FRONTEND"
          echo "================================="

          pm2 describe frontend || true

          echo "================================="
          echo "PM2 DESCRIBE BACKEND"
          echo "================================="

          pm2 describe backend || true

          echo "================================="
          echo "PM2 LOGS"
          echo "================================="

          pm2 logs --lines 50 --nostream || true

          echo "================================="
          echo "SAVING PM2"
          echo "================================="

          pm2 save

          echo "================================="
          echo "DEPLOY DONE"
          echo "================================="
